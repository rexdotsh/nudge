<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html {
        background: #111110;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111110" />
    <script>
      // The theme this device last showed, painted before the stylesheet loads; src/app/lib/theme.svelte.ts keeps it.
      {
        const painted = JSON.parse(localStorage.getItem('theme') ?? 'null');
        if (painted) {
          document.documentElement.dataset.theme = painted.theme;
          document.documentElement.style.background = painted.color;
          document.querySelector('meta[name="theme-color"]').content = painted.color;
        }
      }
    </script>
    <meta name="apple-mobile-web-app-title" content="Nudge" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Nudge</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
