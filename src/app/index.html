<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html {
        background: #111110;
      }
    </style>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111110" />
    <script>
      // The theme this device last showed, painted before the stylesheet loads. It is only a cache that
      // src/app/lib/theme.svelte.ts repaints from IndexedDB, so anything unreadable here just launches in Classic.
      {
        let painted = null;
        try {
          painted = JSON.parse(localStorage.getItem('theme'));
        } catch (error) {
          console.warn('the last theme could not be read', error);
        }
        if (__THEMES__.includes(painted?.theme) && CSS.supports('color', painted.color)) {
          document.documentElement.dataset.theme = painted.theme;
          document.documentElement.style.background = painted.color;
          document.querySelector('meta[name="theme-color"]').content = painted.color;
        }
      }
    </script>
    <script>
      // A launch page kept offline can outlive the files it names when deploys come in quick succession; then drop the
      // offline copy and load fresh, once per session.
      addEventListener(
        'error',
        (event) => {
          if (!(event.target instanceof HTMLScriptElement || event.target instanceof HTMLLinkElement)) return;
          try {
            if (sessionStorage.getItem('recovered')) return;
            sessionStorage.setItem('recovered', '1');
          } catch {
            return;
          }
          caches
            .keys()
            .then((keys) =>
              Promise.all(keys.filter((key) => key.startsWith('nudge-')).map((key) => caches.delete(key))),
            )
            .finally(() => location.reload());
        },
        true,
      );
    </script>
    <meta name="apple-mobile-web-app-title" content="Nudge" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Nudge</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
